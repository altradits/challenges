# CI: gofmt, go vet, and the full hidden-test suite on the pinned Go version.
# Every action is pinned by full commit SHA (see comments for the tag each
# SHA was resolved from). Refresh pins with:
#   git ls-remote https://github.com/actions/checkout.git refs/tags/v4
#   git ls-remote https://github.com/actions/setup-go.git refs/tags/v5
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: false # stdlib-only root module; nothing to cache

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: Overlay reference solutions
        run: bash scripts/overlay-solutions.sh

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...
